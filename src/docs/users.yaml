
paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve all registered ShipNow users.
      responses:
        "200":
          description: Users retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Users
      summary: Create a user
      description: Create a new user with a unique email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
              properties:
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                role:
                  type: string
                  enum: [admin, user, driver]
                  default: user
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/User"
        "409":
          description: Email address already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                errorCode: EMAIL_ALREADY_REGISTERED
                statusCode: 409
                message: Email already registered
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a registered user using a MongoDB document ID.
      parameters:
        - in: path
          name: id
          required: true
          description: MongoDB user identifier.
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        "200":
          description: User retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid MongoDB identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                errorCode: INVALID_ID
                statusCode: 400
                message: Invalid resource ID
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                errorCode: USER_NOT_FOUND
                statusCode: 404
                message: User not found
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Users
      summary: Update a user
      description: Update an existing user's information.
      parameters:
        - in: path
          name: id
          required: true
          description: MongoDB user identifier.
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: Jane
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: jane@example.com
                role:
                  type: string
                  enum: [admin, user, driver]
                  example: user
      responses:
        "200":
          description: User updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid MongoDB identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                errorCode: INVALID_ID
                statusCode: 400
                message: Invalid resource ID
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                errorCode: USER_NOT_FOUND
                statusCode: 404
                message: User not found
        "409":
          description: Email address already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                errorCode: EMAIL_ALREADY_REGISTERED
                statusCode: 409
                message: Email already registered
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
