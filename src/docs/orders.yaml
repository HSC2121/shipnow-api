tags:
- name: Orders
  description: Order management and status transitions
paths:
  /api/orders:
    get:
      tags:
      - Orders
      summary: Get paginated orders
      description: 'Retrieve paginated orders. Defaults: page=1, limit=10; maximum limit=100.'
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    type: object
                    required:
                    - page
                    - limit
                    - total
                    - totalPages
                    - hasNextPage
                    - hasPreviousPage
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 25
                      totalPages:
                        type: integer
                        example: 3
                      hasNextPage:
                        type: boolean
                        example: true
                      hasPreviousPage:
                        type: boolean
                        example: false
        '400':
          description: Invalid page or limit (INVALID_PAGINATION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                errorCode: INVALID_PAGINATION
                statusCode: 400
                message: Pagination parameters must be positive integers and limit cannot exceed 100
      parameters:
      - in: query
        name: page
        required: false
        description: Page number, starting at 1.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - in: query
        name: limit
        required: false
        description: Items per page (maximum 100).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        example: 10
    post:
      tags:
      - Orders
      summary: Create a new order
      description: 'Create an order for an existing user. New orders must start with pending status.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              - total
              - deliveryAddress
              properties:
                user:
                  type: string
                  description: Existing user MongoDB ObjectId.
                  example: 507f1f77bcf86cd799439011
                total:
                  type: number
                  minimum: 0
                  example: 150.5
                deliveryAddress:
                  type: string
                  minLength: 1
                  example: 123 Test Street
                priority:
                  type: string
                  enum:
                  - low
                  - normal
                  - high
                  default: normal
                  example: normal
                status:
                  type: string
                  enum:
                  - pending
                  default: pending
                  example: pending
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order data or initial status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  summary: Missing or invalid order data
                  value:
                    status: error
                    errorCode: INVALID_ORDER_DATA
                    statusCode: 400
                    message: Valid user, total, and delivery address are required
                invalidStatus:
                  summary: Invalid initial order status
                  value:
                    status: error
                    errorCode: INVALID_ORDER_STATUS
                    statusCode: 400
                    message: Invalid order status
        '404':
          description: Referenced user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                errorCode: USER_NOT_FOUND
                statusCode: 404
                message: User not found
  /api/orders/{id}:
    get:
      tags:
      - Orders
      summary: Get an order by ID
      description: Retrieve an existing order by its MongoDB ObjectId.
      parameters:
      - in: path
        name: id
        required: true
        description: MongoDB order ObjectId.
        schema:
          type: string
        example: 507f1f77bcf86cd799439014
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                errorCode: INVALID_ID
                statusCode: 400
                message: Invalid resource ID
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                errorCode: ORDER_NOT_FOUND
                statusCode: 404
                message: Order not found
  /api/orders/{id}/status:
    patch:
      tags:
      - Orders
      summary: Update order status
      description: 'Update the status of an existing order.


        Allowed transitions:

        - pending -> confirmed or cancelled

        - confirmed -> in_transit or cancelled

        - in_transit -> delivered or cancelled

        - delivered -> no further transitions

        - cancelled -> no further transitions


        Invalid transitions return HTTP 409.

        '
      parameters:
      - in: path
        name: id
        required: true
        description: MongoDB order ObjectId.
        schema:
          type: string
        example: 507f1f77bcf86cd799439014
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - pending
                  - confirmed
                  - in_transit
                  - delivered
                  - cancelled
                  example: confirmed
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: Invalid order ID
                  value:
                    status: error
                    errorCode: INVALID_ID
                    statusCode: 400
                    message: Invalid resource ID
                invalidStatus:
                  summary: Invalid order status
                  value:
                    status: error
                    errorCode: INVALID_ORDER_STATUS
                    statusCode: 400
                    message: Invalid order status
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                errorCode: ORDER_NOT_FOUND
                statusCode: 404
                message: Order not found
        '409':
          description: Invalid order status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                errorCode: INVALID_ORDER_TRANSITION
                statusCode: 409
                message: Invalid order status transition
